# fly.toml app configuration file generated for stormedgev2 on 2026-08-04T07:24:09+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'stormedgev2'
primary_region = 'arn'

[build]
  dockerfile = 'Dockerfile'

[env]
  DB_PATH = '/data/bot.db'
  PAPER_MODE = 'true'
  PAUSE_SCANNING = 'false'
  PORT = '8080'
  STARTING_BANKROLL = '10.0'
  MIN_DEPTH_MULTIPLE = '3.0'
  MIN_ENTRY_PRICE = '0.70'
  MAX_ENTRY_PRICE = '0.77'
  SCAN_INTERVAL_MINUTES = '2'
  MAX_CONCURRENT_POSITIONS = '4'
  TRADE_LOW_MARKETS = 'true'
  TRADE_HIGH_MARKETS = 'true'
  MAX_HOURS_TO_RESOLUTION = '48.0'
  REQUIRE_SAME_DAY = 'true'
  FORECAST_MARGIN_F = '4.0'
  # Portfolio B: 10 Safe + High Volume cities (99.08% WR, ~3.7 trades/day)
  # KEEP: Dallas, Toronto, Buenos Aires, Atlanta, London, Seattle, Chicago, Wellington, Miami, Beijing
  EXCLUDED_CITIES = 'Amsterdam,Ankara,Austin,Berlin,Busan,Cape Town,Chengdu,Chongqing,Denver,Guangzhou,Helsinki,Hong Kong,Houston,Istanbul,Jakarta,Jeddah,Kuala Lumpur,Lagos,Los Angeles,Lucknow,Madrid,Manila,Mexico City,Milan,Moscow,Munich,NYC,New York,Panama,Paris,Qingdao,San Francisco,Sao Paulo,Seoul,Shanghai,Shenzhen,Singapore,Taipei,Tel Aviv,Tokyo,Warsaw,Wuhan'

[processes]
  app = 'python app.py'

[[mounts]]
  source = 'bot_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '2m0s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
