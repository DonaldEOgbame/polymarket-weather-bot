# fly.toml app configuration file generated for stormedgev2 on 2026-08-04T07:24:09+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'stormedgev2'
primary_region = 'arn'

[build]
  dockerfile = 'Dockerfile'

[env]
  DB_PATH = '/data/bot.db'
  PAPER_MODE = 'true'
  PORT = '8080'
  STARTING_BANKROLL = '100.0'
  MIN_DEPTH_MULTIPLE = '3.0'
  MIN_ENTRY_PRICE = '0.65'
  MAX_ENTRY_PRICE = '0.82'
  SCAN_INTERVAL_MINUTES = '2'
  MAX_CONCURRENT_POSITIONS = '6'
  TRADE_LOW_MARKETS = 'true'
  TRADE_HIGH_MARKETS = 'false'
  MAX_HOURS_TO_RESOLUTION = '48.0'
  FORECAST_MARGIN_F = '2.0'

[processes]
  app = 'python app.py'

[[mounts]]
  source = 'bot_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '2m0s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
