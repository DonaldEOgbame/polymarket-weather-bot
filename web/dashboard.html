<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>stormedge — desk</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:           #07080a;
    --bg-2:         #0a0c10;
    --panel:        #0d0f13;
    --panel-2:      #11141a;
    --line:         rgba(255,255,255,0.07);
    --line-2:       rgba(255,255,255,0.05);
    --line-3:       rgba(255,255,255,0.09);
    --hairline:     rgba(255,255,255,0.055);
    --text:         #e9e6df;
    --text-soft:    #b4b0a6;
    --muted:        #767065;
    --dim:          #4a4640;
    --signal:       #f5b13c;
    --signal-hi:    #ffd694;
    --signal-mid:   #e39c33;
    --signal-deep:  #c1913f;
    --positive:     #6cbf85;
    --pos-soft:     rgba(108,191,133,0.16);
    --negative:     #e07866;
    --neg-soft:     rgba(224,120,102,0.16);
    --warn:         #f0934f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', ui-sans-serif, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }
  /* The page itself never scrolls — the app frame owns the viewport and its
     panes scroll internally. */
  body { overflow: hidden; }
  input, button, textarea { font-family: 'Manrope', sans-serif; }
  a { color: var(--signal); text-decoration: none; }
  a:hover { color: #ffca6b; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 99px; }
  ::-webkit-scrollbar-track { background: transparent; }
  input::placeholder { color: var(--dim); }

  @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .25 } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }

  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .pos { color: var(--positive); }
  .neg { color: var(--negative); }
  .dim { color: var(--muted); }
  .small { font-size: 11px; }
  .trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .spacer { flex: 1; }

  /* ============ APP FRAME ============ */
  .app {
    height: 100dvh;
    width: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background:
      radial-gradient(1100px 520px at 82% -12%, rgba(245,177,60,0.06), transparent 62%),
      var(--bg);
    color: var(--text);
  }

  /* ============ TOPBAR ============ */
  .topbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 12px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    background: rgba(7,8,10,0.7);
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand .mark { display: block; flex: 0 0 auto; }
  .brand-word {
    font-size: 16.5px;
    font-weight: 700;
    letter-spacing: -0.03em;
    white-space: nowrap;
  }
  .brand-word em { font-style: normal; color: var(--signal); }

  /* Segmented pill group; the active tab is an amber gradient chip. */
  .top-nav {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 3px;
    border-radius: 12px;
    background: rgba(255,255,255,0.035);
    border: 1px solid var(--line-2);
  }
  .nav-item {
    padding: 7px 15px;
    border: 0;
    border-radius: 9px;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    font-weight: 400;
    white-space: nowrap;
    cursor: pointer;
    transition: background .18s ease, color .18s ease;
  }
  .nav-item:hover { color: var(--text-soft); }
  .nav-item.active {
    color: #150f04;
    font-weight: 600;
    background: linear-gradient(180deg, var(--signal-hi), var(--signal-mid));
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.4);
  }

  .top-right { display: flex; align-items: center; gap: 8px; }

  .mode-pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 5px 12px 5px 9px;
    border-radius: 999px;
    border: 1px solid rgba(245,177,60,0.4);
    background: rgba(245,177,60,0.08);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10.5px;
    letter-spacing: 0.14em;
    color: var(--signal);
    white-space: nowrap;
  }
  .mode-pill .mode-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--signal);
    animation: pulse 2.4s ease-in-out infinite;
  }
  .mode-live {
    border-color: rgba(108,191,133,0.4);
    background: rgba(108,191,133,0.08);
    color: var(--positive);
  }
  .mode-live .mode-dot { background: var(--positive); }
  .mode-toggleable { cursor: pointer; user-select: none; }
  .mode-toggleable:hover { background: rgba(245,177,60,0.14); }
  .mode-live.mode-toggleable:hover { background: rgba(108,191,133,0.14); }

  .last-scan {
    display: flex; align-items: center; gap: 7px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10.5px;
    letter-spacing: 0.1em;
    color: var(--muted);
    white-space: nowrap;
  }
  .last-scan b { color: var(--text); font-weight: 400; }
  .scan-pulse {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--positive);
    animation: pulse 2s ease-in-out infinite;
  }

  /* Square icon buttons — bell and sign-out share one shape. */
  .icon-btn {
    position: relative;
    width: 32px; height: 32px;
    flex: 0 0 auto;
    display: grid; place-items: center;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.03);
    color: var(--text-soft);
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    text-decoration: none;
    padding: 0;
    transition: color .15s ease, border-color .15s ease;
  }
  .icon-btn:hover { color: var(--signal); border-color: rgba(245,177,60,0.45); }
  .icon-btn .glyph { font-family: 'JetBrains Mono', ui-monospace, monospace; }

  .notif { position: relative; display: flex; }
  .notif-badge {
    position: absolute;
    top: -4px; right: -4px;
    min-width: 15px; height: 15px;
    padding: 0 3px;
    border-radius: 99px;
    background: var(--negative);
    color: #1a0d0a;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 9px;
    font-weight: 600;
    display: grid; place-items: center;
  }
  .notif-popup {
    position: absolute;
    top: 40px; right: 0;
    z-index: 40;
    width: 308px;
    max-height: 60vh;
    display: flex; flex-direction: column;
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 16px;
    background: var(--panel-2);
    box-shadow: 0 24px 60px rgba(0,0,0,0.6);
    overflow: hidden;
    animation: rise .18s ease both;
  }
  .notif-popup-head {
    display: flex; justify-content: space-between;
    padding: 12px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    font-size: 12.5px;
  }
  .notif-popup-head span:first-child { font-weight: 600; }
  .notif-popup-head span:last-child { color: var(--dim); font-family: 'JetBrains Mono', monospace; }
  .notif-list { overflow-y: auto; }
  .notif-item {
    display: flex; gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .notif-item:last-child { border-bottom: 0; }
  .notif-dot {
    width: 6px; height: 6px;
    margin-top: 5px;
    flex: 0 0 auto;
    border-radius: 50%;
  }
  .notif-error   .notif-dot { background: var(--negative); }
  .notif-warning .notif-dot { background: var(--warn); }
  .notif-info    .notif-dot { background: var(--positive); }
  .notif-item-msg { font-size: 12.5px; line-height: 1.35; word-break: break-word; }
  .notif-item-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--dim);
    margin-top: 4px;
  }
  .notif-empty { padding: 24px 14px; text-align: center; color: var(--dim); font-size: 12px; }

  /* ============ MAIN ============ */
  .main {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 14px 20px;
    overflow: hidden;
  }

  .banner {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px;
    border-radius: 12px;
    font-size: 12.5px;
    line-height: 1.4;
  }
  .banner-circuit {
    border: 1px solid rgba(224,120,102,0.4);
    background: rgba(224,120,102,0.12);
    color: var(--negative);
    font-weight: 500;
  }

  /* ============ CARDS ============ */
  /* Padded card — used where the whole card is content (KPI strips, settings). */
  .card {
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--panel);
  }
  /* Pane — a header rail over a scrolling body, clipped to the radius. */
  .pane {
    display: flex;
    flex-direction: column;
    min-height: 0;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--panel);
    overflow: hidden;
  }
  .pane-head {
    flex: 0 0 auto;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--line-2);
  }
  /* Archive and Signals each own the rest of the frame under their header. */
  .list-pane { flex: 1; }
  .pane-head.center { align-items: center; }
  .pane-head.wrap { flex-wrap: wrap; align-items: center; padding: 14px 16px; }
  .pane-head.block { display: block; padding: 14px 16px; }
  .pane-head h2 { margin: 0; font-size: 14.5px; font-weight: 600; }
  .pane-head .card-sub { margin: 3px 0 0; font-size: 11.5px; color: var(--muted); }
  .pane-body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .pill {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10.5px;
    padding: 5px 10px;
    border-radius: 99px;
    border: 1px solid var(--line-3);
    color: var(--text-soft);
    white-space: nowrap;
  }

  /* ============ KPI STRIP ============ */
  .header-strip {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: 1.5fr 1fr 1fr 1fr;
    gap: 12px;
  }
  .kpi {
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--panel);
    padding: 14px 16px;
  }
  .kpi-hero {
    border-color: rgba(245,177,60,0.18);
    background: linear-gradient(150deg, rgba(245,177,60,0.10), rgba(245,177,60,0.02) 60%, rgba(255,255,255,0.01));
  }
  .kpi-label {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 9.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .kpi-hero .kpi-label { color: var(--signal-deep); }
  .kpi-value {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 23px;
    margin-top: 9px;
    letter-spacing: -0.01em;
  }
  .kpi-hero-row { display: flex; align-items: flex-end; gap: 10px; margin-top: 8px; }
  .kpi-hero-row .kpi-value {
    font-size: 34px;
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 0.95;
    color: var(--signal-hi);
    margin-top: 0;
  }
  .kpi-sub {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px;
    color: var(--muted);
    margin-top: 7px;
  }
  .kpi-rail + .kpi-sub { font-size: 10.5px; margin-top: 6px; }
  .spark { display: flex; align-items: flex-end; gap: 5px; height: 26px; padding-bottom: 2px; }
  .spark span { width: 4px; border-radius: 2px; background: rgba(245,177,60,0.4); }
  .spark span:last-child { background: var(--signal-hi); }
  .kpi-rail {
    height: 3px;
    border-radius: 99px;
    background: rgba(255,255,255,0.07);
    margin-top: 11px;
    overflow: hidden;
  }
  .kpi-rail > i {
    display: block; height: 100%;
    background: linear-gradient(90deg, var(--signal-mid), var(--signal-hi));
    transition: width .3s ease;
  }
  .kpi-rail.neg > i { background: linear-gradient(90deg, var(--negative), var(--warn)); }

  /* ============ DESK ROW ============ */
  .row-main {
    display: grid;
    grid-template-columns: 1.45fr 1fr;
    gap: 12px;
    flex: 1;
    min-height: 0;
  }

  /* ---- globe pane ---- */
  .globe-legend {
    display: flex; flex-direction: column; gap: 4px;
    flex: 0 0 auto;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 9.5px;
    color: var(--muted);
  }
  .globe-legend .lg { display: flex; align-items: center; gap: 6px; }
  .globe-legend .lg i { width: 6px; height: 6px; border-radius: 50%; display: block; }
  .lg-active i  { background: var(--positive); }
  .lg-signal i  { background: var(--signal); }
  .lg-scanned i { background: rgba(245,177,60,0.55); }

  .globe-body {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 1.15fr 1fr;
  }
  .globe-canvas {
    position: relative;
    min-height: 0;
    overflow: hidden;
    user-select: none;
    touch-action: none;
  }
  .globe-tip {
    position: absolute;
    z-index: 5;
    background: rgba(20,22,28,0.96);
    backdrop-filter: blur(8px);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 11px;
    font-size: 12px;
    pointer-events: none;
    min-width: 160px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  .tip-name { font-weight: 600; }
  .tip-coords { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  .tip-row {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; color: var(--text-soft);
    margin-top: 6px; padding-top: 6px;
    border-top: 1px solid rgba(255,255,255,0.04);
  }
  .tip-row .dot { width: 6px; height: 6px; border-radius: 50%; }
  .tip-row .dot.pos { background: var(--positive); }
  .tip-row .dot.sig { background: var(--signal); }
  .tip-row .dot.sc  { background: rgba(245,177,60,0.55); }

  .city-list {
    list-style: none;
    margin: 0;
    min-height: 0;
    overflow: auto;
    border-left: 1px solid var(--line-2);
    padding: 8px;
  }
  .city-row {
    display: flex; align-items: center; gap: 9px;
    padding: 8px 9px;
    border-radius: 10px;
    cursor: default;
  }
  .city-row:hover { background: rgba(255,255,255,0.035); }
  .city-row.sel { background: rgba(245,177,60,0.06); }
  .state-dot { width: 7px; height: 7px; flex: 0 0 auto; border-radius: 50%; }
  .dot-active  { background: var(--positive); box-shadow: 0 0 10px rgba(108,191,133,0.6); }
  .dot-signal  { background: var(--signal); }
  .dot-scanned { background: rgba(245,177,60,0.55); }
  .city-name {
    flex: 1; min-width: 0;
    font-size: 12.5px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .city-meta {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10.5px;
    color: var(--dim);
    white-space: nowrap;
  }
  .city-row.state-active .city-meta { color: var(--text-soft); }

  /* ---- trade cards (open positions everywhere; archive on mobile) ---- */
  .tcard {
    flex: 0 0 auto;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 13px;
    background: var(--panel-2);
    padding: 11px 12px;
  }
  .tcard-top { display: flex; align-items: center; gap: 9px; }
  .tcard-city {
    flex: 1; min-width: 0;
    font-size: 13px; font-weight: 500;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tcard-pnl { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; }
  .tcard-q {
    font-size: 11.5px; color: var(--muted); margin-top: 6px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tcard-meta {
    display: flex; align-items: center; gap: 12px;
    margin-top: 9px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10.5px;
    color: var(--muted);
    flex-wrap: wrap;
  }
  .tcard-meta b { color: var(--text); font-weight: 400; }
  .tcard-foot { display: flex; align-items: center; gap: 8px; margin-top: 9px; }
  .chip {
    padding: 3px 7px;
    border-radius: 6px;
    background: rgba(255,255,255,0.05);
    color: var(--text-soft);
    white-space: nowrap;
  }
  .side-tag {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.08em;
    padding: 3px 7px;
    border-radius: 6px;
    white-space: nowrap;
  }
  .side-yes { background: var(--pos-soft); color: var(--positive); }
  .side-no  { background: var(--neg-soft); color: var(--negative); }

  /* Manual close — a live-only control, so it sits under the card body. */
  .btn-close, .btn-close-go, .btn-close-cancel {
    font: inherit;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 7px;
    border: 1px solid var(--line-3);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
    transition: color .12s ease, border-color .12s ease, background .12s ease;
  }
  .btn-close:hover:not(:disabled) { color: var(--negative); border-color: rgba(224,120,102,0.6); }
  .btn-close:disabled, .btn-close-go:disabled, .btn-close-cancel:disabled { opacity: 0.45; cursor: default; }
  .btn-close-go { background: var(--negative); border-color: var(--negative); color: #1a0d0a; font-weight: 600; }
  .btn-close-go:hover:not(:disabled) { filter: brightness(1.1); }

  .empty-note {
    flex: 1;
    display: grid;
    place-items: center;
    padding: 24px 12px;
    font-size: 12.5px;
    color: var(--muted);
    text-align: center;
  }

  /* ============ PERFORMANCE STRIP ============ */
  .perf-card {
    flex: 0 0 auto;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--panel);
    padding: 12px 16px;
  }
  .perf-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
  }
  .perf-title { font-size: 13px; font-weight: 600; }
  .perf-title .dim { font-weight: 400; }
  .perf-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(108px, 1fr));
    gap: 10px;
  }
  .perf-tile {
    border-radius: 11px;
    background: var(--panel-2);
    border: 1px solid var(--line-2);
    padding: 9px 11px;
  }
  .perf-tile .k {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 9px; letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .perf-tile .v {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 16px; margin-top: 5px;
  }
  .perf-tile .s { font-size: 10.5px; color: var(--dim); margin-top: 3px; }

  /* Segmented control (period picker, archive filters) */
  .seg {
    display: flex;
    gap: 3px;
    padding: 3px;
    border-radius: 10px;
    background: var(--bg-2);
    border: 1px solid rgba(255,255,255,0.06);
    flex: 0 0 auto;
  }
  .seg button {
    padding: 5px 11px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--muted);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10.5px;
    cursor: pointer;
    transition: background .16s ease, color .16s ease;
  }
  .seg button.on { background: rgba(245,177,60,0.16); color: var(--signal-hi); }
  .seg button:hover:not(.on) { color: var(--text-soft); }
  .seg.text button { font-family: 'Manrope', sans-serif; font-size: 11.5px; padding: 6px 11px; }

  /* ============ ARCHIVE TABLE ============ */
  .arch-cols {
    display: grid;
    grid-template-columns: 2.2fr .7fr 1fr .8fr 1fr 1.4fr .7fr;
    gap: 10px;
  }
  .arch-head {
    flex: 0 0 auto;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line-2);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 9.5px;
    letter-spacing: 0.13em;
    color: var(--muted);
  }
  .arch-head .r { text-align: right; }
  .list-body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 6px 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .arch-row {
    flex: 0 0 auto;
    align-items: center;
    padding: 11px 16px;
    border-radius: 10px;
  }
  .arch-row:hover { background: rgba(255,255,255,0.03); }
  .arch-row .r { text-align: right; }
  .cell-city { min-width: 0; }
  .cell-city .city-line { font-size: 13px; font-weight: 500; }
  .cell-city .city-q {
    font-size: 11px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .arch-prices, .arch-size {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 12px; color: var(--text-soft);
  }
  .arch-pnl { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; }
  .arch-pnl .pct { font-size: 10px; opacity: .75; }
  .arch-ago { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: var(--dim); }
  .reason-chip {
    display: inline-block;
    font-size: 11px;
    padding: 4px 9px;
    border-radius: 7px;
    background: rgba(255,255,255,0.05);
    color: var(--text-soft);
    white-space: nowrap;
  }
  .reason-won  { background: rgba(108,191,133,0.14); color: var(--positive); }
  .reason-cut  { background: rgba(240,147,79,0.14);  color: var(--warn); }
  .reason-lost { background: rgba(224,120,102,0.14); color: var(--negative); }

  /* ============ SIGNALS ============ */
  .funnel-card {
    flex: 0 0 auto;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--panel);
    padding: 13px 16px;
  }
  .funnel-head { font-size: 13px; font-weight: 600; margin-bottom: 11px; }
  .funnel-head .dim { font-weight: 400; }
  .scan-funnel {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 10px;
  }
  .funnel-step {
    border-radius: 11px;
    background: var(--panel-2);
    border: 1px solid var(--line-2);
    padding: 10px 12px;
  }
  .funnel-step .k {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 9px; letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .funnel-step .v {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 19px; margin-top: 5px;
  }
  .funnel-rail {
    height: 3px; border-radius: 99px;
    background: rgba(255,255,255,0.06);
    margin-top: 8px; overflow: hidden;
  }
  .funnel-rail > i { display: block; height: 100%; transition: width .3s ease; }
  .funnel-step .c {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10px; color: var(--dim); margin-top: 5px;
  }

  .sig-head-row {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 10px;
  }
  .signals-search {
    height: 34px;
    width: 190px;
    padding: 0 12px;
    border-radius: 10px;
    border: 1px solid var(--line-3);
    background: var(--bg-2);
    color: var(--text);
    font-size: 12.5px;
    outline: none;
    flex: 0 0 auto;
  }
  .signals-search:focus { border-color: rgba(245,177,60,0.5); }
  .gate-bar {
    display: flex;
    height: 8px;
    border-radius: 99px;
    overflow: hidden;
    margin-top: 13px;
    background: rgba(255,255,255,0.05);
  }
  .gate-seg { height: 100%; cursor: pointer; transition: opacity .18s ease; }
  .gate-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 11px; }
  .gate-legend span {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px;
    cursor: pointer;
    user-select: none;
  }
  .gate-legend i { width: 7px; height: 7px; border-radius: 2px; display: block; flex: 0 0 auto; }
  .gate-legend .n { font-family: 'JetBrains Mono', ui-monospace, monospace; color: var(--dim); }

  .sig-row {
    flex: 0 0 auto;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.06);
    background: var(--panel-2);
    overflow: hidden;
  }
  .sig-row.open { border-color: rgba(245,177,60,0.28); background: rgba(245,177,60,0.05); }
  .sig-top {
    display: grid;
    grid-template-columns: 1.6fr 1.1fr 1.3fr;
    gap: 10px;
    align-items: center;
    padding: 11px 13px;
    cursor: pointer;
  }
  .sig-city { font-size: 13px; font-weight: 500; }
  .sig-when {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10.5px; color: var(--muted); margin-top: 2px;
  }
  .sig-edge { display: flex; align-items: center; gap: 8px; }
  .sig-edge-track {
    flex: 1; height: 4px; min-width: 34px;
    border-radius: 99px;
    background: rgba(255,255,255,0.07);
    overflow: hidden;
  }
  .sig-edge-track > i { display: block; height: 100%; }
  .sig-edge-val { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; }
  .sig-gate { display: flex; justify-content: flex-end; align-items: center; gap: 9px; }
  .gate-pill {
    font-size: 11px;
    padding: 4px 9px;
    border-radius: 7px;
    background: rgba(255,255,255,0.05);
    color: var(--text-soft);
    white-space: nowrap;
  }
  .gate-pill.taken { background: var(--pos-soft); color: var(--positive); }
  .sig-chev { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: var(--dim); }
  .sig-detail {
    display: grid;
    grid-template-columns: 1fr 1.1fr 1.4fr;
    gap: 14px;
    padding: 0 13px 13px;
  }
  .detail-block { border-radius: 10px; background: var(--panel-2); padding: 11px 12px; }
  .sig-row.open .detail-block { background: #11141a; }
  .detail-block h4 {
    margin: 0 0 8px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 9px; letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 400;
  }
  .detail-block .kv {
    display: flex; justify-content: space-between; gap: 12px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11.5px;
    padding: 3px 0;
  }
  .detail-block .kv span:first-child { color: var(--muted); }
  .reason-full { font-size: 12px; line-height: 1.5; color: var(--text-soft); }

  /* ============ SETTINGS ============ */
  .settings-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: 1fr auto;
    gap: 12px;
    flex: 1;
    min-height: 0;
  }
  .set-card {
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: auto;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--panel);
    padding: 16px 18px;
  }
  .set-title { display: flex; align-items: baseline; gap: 9px; margin-bottom: 14px; }
  .set-title h2 { margin: 0; font-size: 14.5px; font-weight: 600; }
  .set-kicker {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 9.5px; letter-spacing: 0.14em;
    color: var(--dim);
  }
  .set-row { display: flex; align-items: center; gap: 14px; }
  .set-row .grow { flex: 1; min-width: 0; }
  .field-label { font-size: 13px; font-weight: 500; }
  .field-help { font-size: 11.5px; color: var(--muted); margin-top: 3px; line-height: 1.4; }
  .field-error { font-size: 11.5px; color: var(--negative); margin-top: 4px; line-height: 1.4; }
  .field-warn  { font-size: 11.5px; color: var(--signal); margin-top: 4px; line-height: 1.4; }
  .set-div { height: 1px; background: var(--hairline); flex: 0 0 auto; }
  .set-fill { flex: 1; min-height: 10px; }
  .pad-b { padding-bottom: 13px; }
  .pad-y { padding: 13px 0; }
  .pad-y-lg { padding: 14px 0; }
  .pad-t { padding-top: 14px; }

  .stepper {
    flex: 0 0 auto;
    display: flex; align-items: center;
    border: 1px solid var(--line-3);
    border-radius: 11px;
    background: var(--bg-2);
    overflow: hidden;
  }
  .stepper button {
    width: 32px; height: 38px;
    flex: 0 0 auto;
    border: 0;
    background: transparent;
    color: var(--text-soft);
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .stepper button:hover:not(:disabled) { background: rgba(245,177,60,0.12); color: var(--signal); }
  .stepper button:disabled { opacity: 0.35; cursor: not-allowed; }
  .stepper-val {
    display: flex; align-items: baseline; justify-content: center; gap: 3px;
    width: 74px;
  }
  .stepper-val.wide { width: 82px; }
  .stepper-affix { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: var(--muted); }
  .stepper input {
    width: 42px;
    border: 0; outline: 0;
    background: transparent;
    color: var(--text);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 14px;
    text-align: right;
    padding: 0;
  }
  .stepper-val.wide input { width: 52px; }
  .stepper.has-error { border-color: var(--negative); }

  .pos-options { display: flex; gap: 5px; flex: 0 0 auto; }
  .pos-options button {
    width: 36px; height: 36px;
    border-radius: 10px;
    border: 1px solid var(--line-3);
    background: rgba(0,0,0,0.35);
    color: var(--muted);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 13px;
    cursor: pointer;
    transition: transform .12s ease;
  }
  .pos-options button:hover { transform: translateY(-2px); }
  .pos-options button.on {
    background: linear-gradient(180deg, var(--signal-hi), var(--signal-mid));
    border-color: rgba(255,214,148,0.9);
    color: #150f04;
  }

  .slider-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .slider-read {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 12.5px;
    color: var(--signal-hi);
    white-space: nowrap;
  }
  .slider-read .unit { color: var(--muted); font-size: 11px; }
  .slider-help { font-size: 11.5px; color: var(--muted); margin: 4px 0 11px; }
  .range {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 4px;
    border-radius: 99px;
    outline: none;
    cursor: pointer;
    background: rgba(255,255,255,0.08);
  }
  .range::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px; border-radius: 50%;
    background: linear-gradient(180deg, var(--signal-hi), var(--signal-mid));
    border: 1px solid rgba(255,255,255,0.35);
    box-shadow: 0 2px 8px rgba(245,177,60,0.5);
    cursor: grab;
  }
  .range:active::-webkit-slider-thumb { cursor: grabbing; transform: scale(1.12); }
  .range::-moz-range-thumb {
    width: 15px; height: 15px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.35);
    background: linear-gradient(180deg, var(--signal-hi), var(--signal-mid));
    box-shadow: 0 2px 8px rgba(245,177,60,0.5);
    cursor: grab;
  }
  .range:disabled { cursor: not-allowed; }
  .range:disabled::-webkit-slider-thumb { background: #3a3833; box-shadow: none; cursor: not-allowed; }
  .dependent-off { opacity: 0.4; transition: opacity .2s ease; }

  .switch {
    flex: 0 0 auto;
    position: relative;
    width: 64px; height: 34px;
    border-radius: 99px;
    border: 1px solid var(--line-3);
    background: rgba(0,0,0,0.4);
    cursor: pointer;
    padding: 0;
    transition: background .22s ease, border-color .22s ease;
  }
  .switch .switch-label {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: flex-end;
    padding: 0 10px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 9px; letter-spacing: 0.12em;
    color: var(--muted);
    transition: color .2s ease;
  }
  .switch .switch-knob {
    position: absolute; top: 3px; left: 3px;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: #3a3833;
    box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    transition: transform .26s cubic-bezier(.4,1.5,.5,1), background .22s ease;
  }
  .switch.on { background: rgba(245,177,60,0.18); border-color: rgba(245,177,60,0.5); }
  .switch.on .switch-label { justify-content: flex-start; color: var(--signal); }
  .switch.on .switch-knob {
    transform: translateX(30px);
    background: linear-gradient(180deg, var(--signal-hi), var(--signal-mid));
    box-shadow: 0 2px 10px rgba(245,177,60,0.45);
  }

  .means-card {
    flex: 0 0 auto;
    border-radius: 13px;
    border: 1px solid rgba(245,177,60,0.16);
    background: linear-gradient(180deg, rgba(245,177,60,0.06), rgba(245,177,60,0.015));
    padding: 12px 14px;
  }
  .means-label {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 9.5px; letter-spacing: 0.16em;
    color: var(--signal-deep);
    margin-bottom: 8px;
  }
  .means-hero { display: flex; align-items: flex-end; gap: 11px; flex-wrap: wrap; }
  .means-hero .v {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 27px; color: var(--signal-hi); line-height: 0.9;
  }
  .means-hero .s {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px; color: var(--muted); padding-bottom: 3px;
  }
  .means-rail {
    height: 4px; border-radius: 99px;
    background: rgba(255,255,255,0.07);
    margin: 11px 0 10px;
    overflow: hidden;
  }
  .means-rail > i {
    display: block; height: 100%;
    background: linear-gradient(90deg, var(--signal-mid), var(--signal-hi));
  }
  .means-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 5px 14px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px;
  }
  .means-grid > div { display: flex; justify-content: space-between; gap: 8px; }
  .means-grid .k { color: var(--muted); }
  .means-grid .v.warn { color: var(--signal); }

  .note-row {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 10px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.06);
    background: var(--panel-2);
    padding: 11px 13px;
  }
  .note-row .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--positive); flex: 0 0 auto; }
  .note-row span:last-child { font-size: 11.5px; color: var(--muted); line-height: 1.35; }

  .outcome-pair { flex: 0 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .outcome-cell {
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.06);
    background: var(--panel-2);
    padding: 11px 13px;
  }
  .outcome-cell .k {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 9px; letter-spacing: 0.14em;
    color: var(--muted);
  }
  .outcome-cell .v {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 17px; margin-top: 5px;
  }
  .outcome-cell .v.down { color: var(--negative); }
  .outcome-cell .v.up   { color: var(--positive); }
  .outcome-cell .n { font-size: 10.5px; color: var(--dim); margin-top: 4px; }

  /* The entry price the upside is quoted from — an editable assumption, so it
     reads as a sentence with a field in it rather than a settings row. The
     stepper is shrunk to sit inside the small outcome cell; the overrides beat
     the mobile .stepper rules on specificity, so it stays compact there too. */
  .entry-assump { display: flex; align-items: center; gap: 6px; margin-top: 7px; }
  .entry-lead { font-size: 10.5px; color: var(--dim); white-space: nowrap; }
  .entry-assump .stepper { border-radius: 8px; }
  .entry-assump .stepper button { width: 24px; height: 26px; font-size: 13px; }
  .entry-assump .stepper-val { width: 52px; gap: 2px; }
  .entry-assump .stepper input { width: 32px; font-size: 12px; }
  .entry-assump .stepper-affix { font-size: 10px; }
  .linkish {
    border: 0; padding: 0; background: none;
    color: var(--signal); font: inherit; cursor: pointer;
    text-decoration: underline; text-underline-offset: 2px;
  }
  .linkish:hover { color: var(--text); }

  .save-bar {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 12px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--bg-2);
    padding: 11px 16px;
  }
  .save-bar .dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
  .save-bar .label { font-size: 12.5px; color: var(--muted); }
  .btn-undo {
    height: 38px; padding: 0 16px;
    border-radius: 12px;
    border: 1px solid var(--line-3);
    background: transparent;
    color: var(--muted);
    font-size: 13px; font-weight: 500;
    cursor: pointer;
    transition: color .15s ease, border-color .15s ease;
  }
  .btn-undo:hover:not(:disabled) { color: var(--text); border-color: rgba(255,255,255,0.2); }
  .btn-undo:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-save {
    height: 38px; padding: 0 22px;
    border-radius: 12px;
    border: 0;
    background: rgba(255,255,255,0.05);
    color: var(--dim);
    font-size: 13.5px; font-weight: 600;
    cursor: default;
    transition: transform .12s ease, box-shadow .2s ease;
  }
  .btn-save.armed {
    background: linear-gradient(180deg, var(--signal-hi), var(--signal-mid));
    color: #150f04;
    box-shadow: 0 4px 18px rgba(245,177,60,0.3), inset 0 1px 0 rgba(255,255,255,0.4);
    cursor: pointer;
  }
  .btn-save.armed:hover:not(:disabled) { transform: translateY(-1px); }
  .btn-save:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  .settings-note {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 9px;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 12.5px; line-height: 1.5;
    background: rgba(245,177,60,0.08);
    border: 1px solid rgba(245,177,60,0.35);
    color: var(--signal);
  }
  .settings-note.err {
    background: rgba(224,120,102,0.12);
    border-color: rgba(224,120,102,0.4);
    color: var(--negative);
  }

  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.72);
    display: grid; place-items: center;
    z-index: 100; padding: 20px;
  }
  .modal {
    width: 100%; max-width: 470px;
    display: flex; flex-direction: column; gap: 13px;
    border: 1px solid var(--line-3);
    border-radius: 16px;
    background: var(--panel);
    padding: 20px 22px;
    animation: rise .18s ease both;
  }
  .modal h3 { margin: 0; font-size: 15.5px; font-weight: 600; }
  .modal-body { font-size: 12.5px; color: var(--text-soft); line-height: 1.6; }
  .modal-diff {
    display: flex; flex-direction: column; gap: 5px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 12px;
  }
  .modal-diff .from { color: var(--muted); text-decoration: line-through; }
  .modal-diff .to { color: var(--signal); }
  .modal-actions { display: flex; gap: 9px; justify-content: flex-end; flex-wrap: wrap; }

  /* ---- trading-mode dialog ---- */
  .mode-now { font-size: 12.5px; color: var(--text-soft); line-height: 1.6; }
  .mode-now b { color: var(--signal-hi); }
  .mode-now b.neg { color: var(--negative); }
  .preflight-title {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 9.5px; letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 2px;
  }
  .preflight-row {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 8px 11px;
    border-radius: 10px;
    background: var(--panel-2);
    border: 1px solid rgba(255,255,255,0.05);
  }
  .preflight-row .glyph {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 12px; line-height: 1.35; flex: 0 0 auto;
  }
  .preflight-row.ok   .glyph { color: var(--positive); }
  .preflight-row.bad  .glyph { color: var(--negative); }
  .preflight-row.warn .glyph { color: var(--warn); }
  .preflight-row.bad { border-color: rgba(224,120,102,0.3); }
  .preflight-label { font-size: 12.5px; font-weight: 500; }
  .preflight-detail { font-size: 11.5px; color: var(--muted); margin-top: 2px; line-height: 1.45; }
  /* Going live is the one destructive-by-design button in the app. */
  .btn-save.armed.danger {
    background: linear-gradient(180deg, #f0934f, #d4553c);
    color: #180b07;
    box-shadow: 0 4px 18px rgba(224,120,102,0.35), inset 0 1px 0 rgba(255,255,255,0.35);
  }

  /* ============ PAGINATION ============ */
  .pagination { display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto; }
  .pg-btn {
    width: 26px; height: 26px;
    display: grid; place-items: center;
    border-radius: 8px;
    border: 1px solid var(--line-3);
    background: transparent;
    color: var(--text-soft);
    font-size: 14px; line-height: 1;
    cursor: pointer;
  }
  .pg-btn:hover:not(:disabled) { color: var(--signal); border-color: rgba(245,177,60,0.45); }
  .pg-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .pg-info {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10.5px; color: var(--muted);
    min-width: 34px; text-align: center;
  }
  .head-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }

  /* ============ FOOTER / BOTTOM NAV ============ */
  .page-foot {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 20px;
    border-top: 1px solid rgba(255,255,255,0.06);
    font-size: 11.5px;
    color: var(--dim);
  }
  .page-foot .mono { letter-spacing: 0.06em; }

  .bottom-nav { display: none; }

  /* ============ LOADING ============ */
  .loading-screen {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100dvh;
    gap: 12px;
    color: var(--muted);
    font-size: 13px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    text-align: center;
  }

  /* ============ COMPACT (short viewport) ============
     The design drops the fill-the-frame behaviour once the window is under
     680px tall: panes stop competing for a sliver of height and the whole
     main column scrolls instead. */
  @media (max-height: 679.98px) {
    .main { overflow: auto; }
    .row-main, .settings-grid, .list-pane { flex: 0 0 auto; min-height: auto; }
    .settings-grid { grid-template-rows: auto; }
    .globe-pane, .positions-pane, .list-pane { min-height: 300px; }
    .globe-body, .pane-body, .list-body, .set-card { flex: 0 0 auto; min-height: auto; overflow: visible; }
    .city-list { overflow: visible; }
  }
  @media (max-height: 679.98px) and (max-width: 1099.98px) {
    .row-main, .settings-grid { grid-template-columns: 1fr; }
  }
  @media (max-height: 679.98px) and (min-width: 1100px) {
    .settings-grid { grid-template-columns: repeat(2, 1fr); }
  }

  /* ============ MOBILE (below 860px) ============ */
  @media (max-width: 859.98px) {
    .main { overflow: auto; padding: 12px; gap: 10px; }
    .topbar { gap: 10px; padding: 11px 14px; }
    .top-nav { display: none; }
    .page-foot { display: none; }
    .last-scan { display: none; }
    .globe-legend { display: none; }

    .row-main, .settings-grid { display: flex; flex-direction: column; }
    .row-main, .settings-grid, .list-pane { flex: 0 0 auto; min-height: auto; }
    .header-strip { grid-template-columns: 1fr 1fr; gap: 10px; }
    .kpi-hero, .kpi-today { grid-column: span 2; }
    .kpi-hero-row .kpi-value { font-size: 30px; }

    .globe-pane, .positions-pane, .list-pane { min-height: 300px; }
    .globe-body { grid-template-columns: 1fr; flex: 0 0 auto; min-height: auto; }
    .globe-canvas { display: none; }
    .city-list { border-left-color: transparent; overflow: visible; }
    .pane-body, .list-body, .set-card { flex: 0 0 auto; min-height: auto; overflow: visible; }
    .list-body { padding: 10px; gap: 10px; }

    .arch-head { display: none; }
    .sig-top, .sig-detail { grid-template-columns: 1fr; }
    .signals-search { width: 100%; }

    /* Fixed bottom tab bar replaces the top nav (thumb reach) */
    .bottom-nav {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: rgba(10,12,16,0.96);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .bottom-nav button {
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      min-height: 48px;
      padding: 7px 0;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--muted);
      font-size: 11.5px;
      font-weight: 400;
      cursor: pointer;
      transition: background .18s ease, color .18s ease;
    }
    .bottom-nav button .bar {
      width: 16px; height: 2px;
      border-radius: 2px;
      background: transparent;
      transition: background .18s ease;
    }
    .bottom-nav button.active {
      background: rgba(245,177,60,0.12);
      color: var(--signal-hi);
      font-weight: 600;
    }
    .bottom-nav button.active .bar { background: var(--signal); }
  }

  /* Narrow phones: the KPI grid gives up its second column. */
  @media (max-width: 560px) {
    .header-strip { grid-template-columns: 1fr; }
    .kpi-hero, .kpi-today { grid-column: auto; }
    .set-card { padding: 14px 15px; }
    .outcome-pair { grid-template-columns: 1fr; }
    .save-bar { flex-wrap: wrap; }
  }

  /* Touch devices: comfortable hit targets regardless of width. */
  @media (pointer: coarse) {
    .nav-item { padding: 10px 14px; }
    .icon-btn { width: 36px; height: 36px; }
    .pg-btn { width: 32px; height: 32px; }
    .seg button { padding: 8px 12px; }
    .city-row { padding: 10px 9px; }
    .stepper button { width: 40px; height: 42px; }
    .pos-options button { width: 40px; height: 40px; }
  }
</style>
</head>

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="/globe.js"></script>
<script type="text/babel" src="/dashboard.jsx"></script>
</body>
