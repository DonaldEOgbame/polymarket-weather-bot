<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- The header brand mark (dashboard.jsx <Logo>), retuned for a 16px tab:
       the hairline outer ring is dropped, strokes are thickened and the faint
       arcs lifted in opacity, since sub-pixel strokes vanish at favicon size.
       The panel-coloured tile keeps the amber legible on a light tab bar. -->
  <defs>
    <radialGradient id="eye" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd694"/>
      <stop offset="1" stop-color="#e39c33"/>
    </radialGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="#0d0f13"/>
  <path d="M16 4.5a11.5 11.5 0 0 1 0 23" fill="none" stroke="#f5b13c" stroke-opacity="0.5" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M16 27.5a11.5 11.5 0 0 1-11.5-11.5" fill="none" stroke="#f5b13c" stroke-opacity="0.24" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M16 9.6a6.4 6.4 0 0 1 0 12.8" fill="none" stroke="#f5b13c" stroke-opacity="0.95" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M16 22.4a6.4 6.4 0 0 1-6.4-6.4" fill="none" stroke="#f5b13c" stroke-opacity="0.45" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="16" cy="16" r="3.1" fill="url(#eye)"/>
</svg>
